APP_NAME <- q(MyShop);
PORT <- 8080;

table([
  app = table([
    name = #{APP_NAME},
    debug = q(false)
  ]),
  server = table([
    host = q(0.0.0.0),
    port = #{PORT},
    tls = table([
      enabled = q(true),
      cert = q(/etc/ssl/shop.pem)
    ])
  ]),
  database = table([
    host = q(db.local),
    pool_size = 10
  ])
])
